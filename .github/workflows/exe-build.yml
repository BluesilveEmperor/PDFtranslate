name: windows exe Release Workflow

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version (e.g., v1.0.0)'
        required: true
        type: string
  # push:
    # debug purpose
env:
  WIN_EXE_PYTHON_VERSION: 3.12.9
jobs:
  build-win64-exe:
    runs-on: windows-latest
    steps:
      - name: checkout babeldoc metadata
        uses: actions/checkout@v6
        with:
          repository: funstory-ai/BabelDOC
          path: babeldoctemp1234567
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: babeldoc/assets/embedding_assets_metadata.py
      - name: Cached Assets
        id: cache-assets
        uses: actions/cache@v5
        with:
          path: ~/.cache/babeldoc
          key: test-1-babeldoc-assets-${{ hashFiles('babeldoctemp1234567/babeldoc/assets/embedding_assets_metadata.py') }}
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup uv with Python ${{ env.WIN_EXE_PYTHON_VERSION }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ env.WIN_EXE_PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: 执行所有任务（创建目录、下载、解压、复制文件、安装依赖）
        shell: pwsh
        run: |
          Write-Host "==== 删除 babeldoctemp1234567 文件夹 ===="
          if (Test-Path "./babeldoctemp1234567") {
              Remove-Item -Path "./babeldoctemp1234567" -Recurse -Force
              Write-Host "babeldoctemp1234567 文件夹已成功删除"
          } else {
              Write-Host "babeldoctemp1234567 文件夹不存在，无需删除"
          }
          Write-Host "==== 创建必要的目录 ===="
          New-Item -Path "./build" -ItemType Directory -Force
          New-Item -Path "./build/runtime" -ItemType Directory -Force
          New-Item -Path "./dep_build" -ItemType Directory -Force

          Write-Host "==== 复制代码到 dep_build ===="
          Get-ChildItem -Path "./" -Exclude "dep_build", "build" | Copy-Item -Destination "./dep_build" -Recurse -Force

          function Invoke-DownloadWithRetry {
              param([string]$Url, [string]$OutFile, [hashtable]$Headers = $null, [int]$MaxAttempts = 5)
              for ($i = 1; $i -le $MaxAttempts; $i++) {
                  try {
                      $params = @{ Uri = $Url; OutFile = $OutFile; TimeoutSec = 300; ErrorAction = "Stop" }
                      if ($Headers) { $params.Headers = $Headers }
                      Invoke-WebRequest @params
                      if ((Test-Path $OutFile) -and ((Get-Item $OutFile).Length -gt 0)) {
                          Write-Host "下载成功(第 $i 次): $Url"
                          return
                      }
                      throw "下载文件为空"
                  } catch {
                      Write-Host "下载失败(第 $i/$MaxAttempts 次): $($_.Exception.Message)"
                      if ($i -lt $MaxAttempts) { Start-Sleep -Seconds (15 * $i) }
                  }
              }
              throw "重试 $MaxAttempts 次后仍失败: $Url"
          }

          Write-Host "==== 下载并解压 Python ${{ env.WIN_EXE_PYTHON_VERSION }} ===="
          Write-Host "pythonUrl: https://www.python.org/ftp/python/${{ env.WIN_EXE_PYTHON_VERSION }}/python-${{ env.WIN_EXE_PYTHON_VERSION }}-embed-amd64.zip"
          $pythonUrl = "https://www.python.org/ftp/python/${{ env.WIN_EXE_PYTHON_VERSION }}/python-${{ env.WIN_EXE_PYTHON_VERSION }}-embed-amd64.zip"
          $pythonZip = "./dep_build/python.zip"
          Invoke-DownloadWithRetry -Url $pythonUrl -OutFile $pythonZip
          Expand-Archive -Path $pythonZip -DestinationPath "./build/runtime" -Force

          Write-Host "==== 通过 GitHub API 下载并解压 PyStand（规避 releases/download 路径 504） ===="
          $pystandZip = "./dep_build/PyStand.zip"
          $pystandHeaders = @{ "Authorization" = "token ${{ secrets.GITHUB_TOKEN }}"; "Accept" = "application/vnd.github+json" }
          $pystandAssetId = $null
          for ($i = 1; $i -le 5; $i++) {
              try {
                  $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/skywind3000/PyStand/releases/tags/1.1.4" -Headers $pystandHeaders -TimeoutSec 60 -ErrorAction Stop
                  $asset = $rel.assets | Where-Object { $_.name -eq "PyStand-v1.1.4-exe.zip" }
                  if ($asset) { $pystandAssetId = $asset.id; break }
                  throw "未找到 PyStand-v1.1.4-exe.zip 资产"
              } catch {
                  Write-Host "解析 PyStand 资产失败(第 $i/5 次): $($_.Exception.Message)"
                  Start-Sleep -Seconds (15 * $i)
              }
          }
          if (-not $pystandAssetId) { throw "无法解析 PyStand 资产 ID" }
          $pystandHeaders["Accept"] = "application/octet-stream"
          Invoke-DownloadWithRetry -Url "https://api.github.com/repos/skywind3000/PyStand/releases/assets/$pystandAssetId" -OutFile $pystandZip -Headers $pystandHeaders
          Expand-Archive -Path $pystandZip -DestinationPath "./dep_build/PyStand" -Force

          Write-Host "==== 复制 PyStand.exe 到 build 并重命名 ===="
          $pystandExe = "./dep_build/PyStand/PyStand-x64-CLI/PyStand.exe"
          $destExe = "./build/pdf2zh.exe"
          if (Test-Path $pystandExe) {
              Copy-Item -Path $pystandExe -Destination $destExe -Force
          } else {
              Write-Host "错误: PyStand.exe 未找到！"
              exit 1
          }
          Write-Host "==== 创建 Python venv 在 dep_build ===="
          uv venv ./dep_build/venv

          ./dep_build/venv/Scripts/activate

          Write-Host "==== 在 venv 环境中安装项目依赖 ===="
          uv pip install .

          Write-Host "==== 写 BitStream 兼容层 (sitecustomize.py) ===="
          Set-Content -Path "./dep_build/venv/Lib/site-packages/sitecustomize.py" -Value "try:`n    from bitstring import BitStream`nexcept ImportError:`n    from bitstring import BitArray`n    import bitstring`n    bitstring.BitStream = BitArray" -Encoding utf8

          Write-Host "==== 复制 venv/Lib/site-packages 到 build/ ===="
          # 注意: 此步骤必须先于捆装——Copy-Item -Recurse 在目标目录已存在时
          # 会把源目录复制成目标的子目录 (build/site-packages/site-packages/),
          # 因此捆装副本要在快照复制完成后再添加
          Copy-Item -Path "./dep_build/venv/Lib/site-packages" -Destination "./build/site-packages" -Recurse -Force

          Write-Host "==== 捆装 precise 内核依赖到 _precise_packages (staging 隔离) ===="
          # 先装进独立 staging 目录再复制: 直接 --target 到主 site-packages
          # 会把共享依赖(tencentcloud-sdk 等)升级污染主程序
          If (Test-Path "./dep_build/_precise_stage") { Remove-Item "./dep_build/_precise_stage" -Recurse -Force }
          Set-Content -Path "./dep_build/_precise_constraints.txt" -Value "bitstring==4.3.0" -Encoding ascii
          uv pip install --target "./dep_build/_precise_stage" -c "./dep_build/_precise_constraints.txt" "./pdf2zh/kernel/PDFMathTranslate-next.git"
          New-Item -Path "./build/site-packages/pdf2zh/kernel" -ItemType Directory -Force | Out-Null
          If (Test-Path "./build/site-packages/pdf2zh/kernel/_precise_packages") { Remove-Item "./build/site-packages/pdf2zh/kernel/_precise_packages" -Recurse -Force }
          Copy-Item "./dep_build/_precise_stage" "./build/site-packages/pdf2zh/kernel/_precise_packages" -Recurse

          Write-Host "==== 复制 script/_pystand_static.int 到 build/ ===="
          $staticFile = "./script/_pystand_static.int"
          $destStatic = "./build/_pystand_static.int"
          if (Test-Path $staticFile) {
              Copy-Item -Path $staticFile -Destination $destStatic -Force
          } else {
              Write-Host "错误: script/_pystand_static.int 未找到！"
              exit 1
          }

          uv run --active babeldoc --generate-offline-assets ./build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: win64-exe
          path: ./build
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true

  test-win64-exe:
    needs:
      - build-win64-exe
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: win64-exe
          path: ./build

      - name: Test show version
        run: |
          Write-Host "==== 诊断: site-packages/pdf2zh 结构 ===="
          Test-Path "./build/site-packages/pdf2zh/pdf2zh.py"
          Test-Path "./build/site-packages/pdf2zh/__init__.py"
          Get-ChildItem "./build/site-packages/pdf2zh" -ErrorAction SilentlyContinue | Select-Object -First 10 Name | Out-String
          Write-Host "==== 诊断: runtime python sys.path ===="
          ./build/runtime/python.exe -c "import sys, json; print(json.dumps(sys.path))"
          ./build/runtime/python.exe -c "import importlib.util; print('pdf2zh spec:', importlib.util.find_spec('pdf2zh'))"
          ./build/pdf2zh.exe --version

      - name: Test - GUI smoke (offline assets restore + gradio up)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "./build/pdf2zh.exe" -ArgumentList "-i" -PassThru -RedirectStandardOutput "gui.log" -RedirectStandardError "gui.err"
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 10
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:7860" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { Write-Host "GUI OK (after $($i*10)s)"; $ok = $true; break }
            } catch { }
          }
          if (-not $ok) {
            Write-Host "GUI failed to start"
            if (Test-Path "gui.log") { Get-Content "gui.log" }
            if (Test-Path "gui.err") { Get-Content "gui.err" }
            exit 1
          }
          if ((Test-Path "gui.log") -and (Select-String -Path "gui.log" -Pattern "find offline_assets_zip" -Quiet)) {
            Write-Host "offline assets restored"
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Get-Process -Name "pdf2zh" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
