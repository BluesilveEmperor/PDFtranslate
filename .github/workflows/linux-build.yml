name: linux tar Release Workflow

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version (e.g., v1.0.0)'
        required: true
        type: string
env:
  RELEASE_VERSION: ${{ inputs.release_version }}
jobs:
  build-linux-tar:
    runs-on: ubuntu-latest
    steps:
      - name: checkout babeldoc metadata
        uses: actions/checkout@v6
        with:
          repository: funstory-ai/BabelDOC
          path: babeldoctemp1234567
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: babeldoc/assets/embedding_assets_metadata.py
      - name: Cached Assets
        id: cache-assets
        uses: actions/cache@v5
        with:
          path: ~/.cache/babeldoc
          key: test-1-babeldoc-assets-${{ hashFiles('babeldoctemp1234567/babeldoc/assets/embedding_assets_metadata.py') }}
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 构建（build.sh 自动检测 Linux 平台）
        env:
          ASSETS_ALLOW_DOWNLOAD: "1"
        run: |
          bash build.sh

      - name: 打包 tar.gz（保留权限与符号链接）
        run: |
          tar czf pdf2zh-linux-x64.tar.gz build
          ls -lh pdf2zh-linux-x64.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-tar
          path: pdf2zh-linux-x64.tar.gz
          if-no-files-found: error
          compression-level: 0

  test-linux-tar:
    needs:
      - build-linux-tar
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-tar

      - name: 解压 tar.gz
        run: |
          tar xzf pdf2zh-linux-x64.tar.gz
          ls -la build/runtime/bin/ | head -5

      - name: Test show version
        run: |
          ./build/pdf2zh --version

      - name: Test - GUI smoke (offline assets restore + gradio up)
        run: |
          ./build/pdf2zh -i > gui.log 2>&1 &
          GUI_PID=$!
          for i in $(seq 1 30); do
            sleep 10
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:7860 || true)
            if [ "$CODE" = "200" ]; then
              echo "GUI OK (after $((i*10))s)"
              break
            fi
          done
          [ "$CODE" = "200" ] || { echo "GUI failed to start"; cat gui.log; exit 1; }
          grep -q "find offline_assets_zip" gui.log && echo "offline assets restored"
          pkill -f launch_pdf2zh || true
          wait $GUI_PID 2>/dev/null || true
