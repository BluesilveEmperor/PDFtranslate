name: Release Assets

on:
  workflow_dispatch:
    inputs:
      win_run_id:
        description: 'Windows build run ID'
        required: true
      mac_run_id:
        description: 'macOS build run ID'
        required: true

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download and upload artifacts to release v0.0.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_RUN_ID: ${{ inputs.win_run_id }}
          MAC_RUN_ID: ${{ inputs.mac_run_id }}
        run: |
          WIN_AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WIN_RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="win64-exe") | .id')
          echo "Windows artifact id: $WIN_AID"
          curl -sL -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$WIN_AID/zip" -o win64-exe.zip
          echo "win64-exe.zip size: $(wc -c < win64-exe.zip) bytes"

          MAC_AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MAC_RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="macos-exe") | .id')
          echo "macOS artifact id: $MAC_AID"
          curl -sL -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$MAC_AID/zip" -o macos-exe.zip
          echo "macos-exe.zip size: $(wc -c < macos-exe.zip) bytes"

          gh release upload v0.0.1 win64-exe.zip macos-exe.zip --clobber --repo "$GITHUB_REPOSITORY"
