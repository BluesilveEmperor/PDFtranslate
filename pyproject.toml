[project]
name = "pdf2zh"
version = "1.9.12"
description = "Latex PDF Translator"
authors = [{ name = "Byaidu", email = "byaidux@gmail.com" }]
license = "AGPL-3.0"
readme = "README.md"
requires-python = ">=3.11,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",

    # for arm64 linux whells
    "pymupdf<1.25.3",
    "tqdm",
    "tenacity",
    "numpy",
    "ollama",
    "xinference-client",
    "deepl",
    "openai>=1.0.0",
    "azure-ai-translation-text<=1.0.1",
    # 5.36 has a bug, webui starts with a white screen
    "gradio<5.36",
    "huggingface_hub",
    "onnx",
    "onnxruntime",
    "opencv-python-headless",
    # Intel macOS (x86_64): onnxruntime 1.19.2 is the last release with a
    # macOS 11-compatible universal2 wheel; opencv 5.x x86_64 wheels require
    # macOS 14+. See spec/macos-intel-adapt/plan.md (R1/R3).
    "onnxruntime==1.19.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # cryptography 49+ ships no x86_64/universal2 macOS wheel (arm64-only), which
    # would force a source build in portable installs; 48.0.1 ships
    # cp39-abi3 macosx_10_9_universal2 (macOS 10.9+).
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # opencv-python-headless<=4.11.0.86 pins the macosx_10_15 x86_64 wheel floor;
    # 4.14+ ships macosx_14_0 x86_64 tags that would raise the artifact floor to
    # macOS 14 (5.x requires macOS 14+ entirely).
    "opencv-python-headless<=4.11.0.86; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # pikepdf 10.x ships no x86_64 macOS wheel (arm64-only) and would fail the
    # scikit-build-core source build (missing qpdf headers); 9.11.0 ships
    # cp312-macosx_13_0_x86_64 wheels.
    "pikepdf<=9.11.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # opencv-python (rapidocr-onnxruntime dep, distinct from -headless):
    # 5.0.0.93 ships abi3-macosx_14_0_x86_64 only; 4.11.0.86 ships
    # abi3-macosx_13_0_x86_64, keeping the artifact floor at macOS 13.
    "opencv-python<=4.11.0.86; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "tencentcloud-sdk-python-tmt==3.1.70",  # newer releases remove TextTranslate
    "pdfminer-six==20250416",
    "gradio_pdf>=0.0.21",
    "pikepdf",
    "peewee>=3.17.8",
    "fontTools",
    "babeldoc>=0.1.22, <0.3.0",
    "rich",
]

[project.optional-dependencies]
ultrafast = ["pdf-inspector>=1.25.2,<2"]
ocr = [
    "pooch>=1.8,<2",  # first-use downloads for PyMuPDF's built-in OCR
]
backend = [
    "flask",
    "celery",
    "redis"
]
argostranslate = [
    "argostranslate"
]
mcp = [
    "mcp>=1.6.0",
]
cuda = [
    "onnxruntime-gpu",
]
dml = [
    "onnxruntime-directml",
]
precise = []  # marker — run `pdf2zh-setup-precise` after install to provision the isolated venv

[dependency-groups]
dev = [
    "black",
    "flake8",
    "pre-commit",
    "pytest",
    "build",
    "bumpver>=2024.1130",
]

[project.urls]
Homepage = "https://github.com/Byaidu/PDFMathTranslate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
pdf2zh = "pdf2zh.pdf2zh:main"
pdf2zh-setup-precise = "pdf2zh.kernel.precise:setup_precise_cli"

[tool.flake8]
ignore = ["E203", "E261", "E501", "W503", "E741"]
max-line-length = 88



[bumpver]
current_version = "1.9.12"
version_pattern = "MAJOR.MINOR.PATCH[.PYTAGNUM]"

[bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"'
]
"pdf2zh/__init__.py" = [
    '__version__ = "{version}"'
]
